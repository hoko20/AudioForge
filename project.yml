name: WQtool
options:
  bundleIdPrefix: local.xchat
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Resources/AppGroup.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: local.xchat.transfer
    MARKETING_VERSION: 2.3.4
    CURRENT_PROJECT_VERSION: 9
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/WQFiles $(SRCROOT)/Core/Sandbox $(SRCROOT)/Core/Metadata $(SRCROOT)/Core/Cache $(SRCROOT)/Core/Audio $(SRCROOT)/Vendor/include $(SRCROOT)/Vendor/include/silk'
    LIBRARY_SEARCH_PATHS: '$(SRCROOT)/Vendor/lib'
    OTHER_LDFLAGS: '-lopencore-amrnb -lopencore-amrwb -lvo-amrwbenc -lSKP_SILK_SDK'
    SWIFT_OBJC_BRIDGING_HEADER: Core/BridgingHeader.h
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_BITCODE: NO
targets:
  WQtool:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Vendor/WQFiles
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libcompression.tbd
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: ImageIO.framework
      - sdk: PDFKit.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - sdk: PhotosUI.framework
schemes:
  WQtool:
    build:
      targets:
        WQtool: all
